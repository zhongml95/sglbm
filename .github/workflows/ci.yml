name: sglbm CI — build examples

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [cavity2d, tgv2d]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make openmpi-bin libopenmpi-dev

      - name: Build ${{ matrix.example }}
        run: |
          cd examples/${{ matrix.example }}
          make -j$(nproc)

      - name: Smoke test ${{ matrix.example }}
        run: |
          cd examples/${{ matrix.example }}
          exe=$(find . -maxdepth 1 -type f -executable | head -n 1)
          if [ -n "$exe" ]; then
            echo "Running smoke test: $exe"
            $exe --help || true
          else
            echo "No executable found in $PWD"
          fi
